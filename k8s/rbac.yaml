apiVersion: v1
kind: ServiceAccount
metadata:
  name: bkvue
  namespace: bkvue
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-argocd-applications
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bkvue-read-applications
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: bkvue
    namespace: bkvue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-argocd-applications
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bkvue-read-cluster-status
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bkvue-read-cluster-status
subjects:
  - kind: ServiceAccount
    name: bkvue
    namespace: bkvue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bkvue-read-cluster-status
