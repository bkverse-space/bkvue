apiVersion: v1
kind: Namespace
metadata:
  name: bkvue
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bkvue
  namespace: bkvue
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-argocd-applications
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bkvue-read-applications
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: bkvue
    namespace: bkvue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-argocd-applications
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bkvue-read-cluster-status
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bkvue-read-cluster-status
subjects:
  - kind: ServiceAccount
    name: bkvue
    namespace: bkvue
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bkvue-read-cluster-status
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bkvue
  namespace: bkvue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bkvue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bkvue
    spec:
      serviceAccountName: bkvue
      containers:
        - name: web
          image: bkvue:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ARGOCD_NAMESPACE
              value: argocd
            - name: REGISTRY_URL
              value: http://registry:5000
            - name: PROMETHEUS_URL
              value: http://prometheus-server.monitoring.svc:9090
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bkvue
  namespace: bkvue
spec:
  selector:
    app.kubernetes.io/name: bkvue
  ports:
    - name: http
      port: 80
      targetPort: http
