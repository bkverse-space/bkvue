apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bkvue.fullname" . }}-argocd-applications
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "bkvue.labels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bkvue.fullname" . }}-argocd-applications
  namespace: {{ .Values.argocd.namespace }}
  labels:
    {{- include "bkvue.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bkvue.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bkvue.fullname" . }}-argocd-applications
{{- if .Values.rbac.readNodesAndPods }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bkvue.fullname" . }}-cluster-status
  labels:
    {{- include "bkvue.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bkvue.fullname" . }}-cluster-status
  labels:
    {{- include "bkvue.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bkvue.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bkvue.fullname" . }}-cluster-status
{{- end }}
