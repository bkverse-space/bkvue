replicaCount: 1

image:
  repository: bkvue
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: workbench.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

argocd:
  namespace: argocd

registry:
  url: http://registry:5000
  verifyTls: true
  timeout: 15
  auth:
    existingSecret: ""
    usernameKey: username
    passwordKey: password

prometheus:
  url: http://prometheus-server.monitoring.svc:9090
  verifyTls: true
  timeout: 10
  auth:
    existingSecret: ""
    tokenKey: token

extraEnv: []

rbac:
  readNodesAndPods: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
