<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}发布工作台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">B</span> bkvue</a>
      <nav class="side-nav">
        <a href="{{ url_for('index') }}"{% if request.endpoint in ('index', 'project_detail') %} class="active"{% endif %}><span class="nav-mark"></span>项目概览</a>
        <a href="{{ url_for('release_control') }}"{% if request.endpoint in ('release_control', 'release_detail') %} class="active"{% endif %}><span class="nav-mark"></span>发布状态</a>
        <a href="{{ url_for('configuration_sources') }}"{% if request.endpoint == 'configuration_sources' %} class="active"{% endif %}><span class="nav-mark"></span>配置源</a>
        <a href="{{ url_for('cluster_status') }}"{% if request.endpoint == 'cluster_status' %} class="active"{% endif %}><span class="nav-mark"></span>集群状态</a>
        <a href="{{ url_for('risk_assessment') }}"{% if request.endpoint == 'risk_assessment' %} class="active"{% endif %}><span class="nav-mark"></span>风险评估</a>
        <a href="{{ url_for('traffic_topology') }}"{% if request.endpoint == 'traffic_topology' %} class="active"{% endif %}><span class="nav-mark"></span>流量路径</a>
        <a href="{{ url_for('registry_index') }}"{% if request.endpoint in ('registry_index', 'repository_detail', 'tag_detail') %} class="active"{% endif %}><span class="nav-mark"></span>镜像仓库</a>
      </nav>
      <div class="cluster-target"><span>单集群</span><strong>Argo CD / {{ argocd_namespace }}</strong></div>
    </aside>
    <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="notice {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
